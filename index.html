<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ocean Mahjong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0d4a6b; --teal:#16a3b5; --aqua:#5fd6d8; --sand:#f3dca8; --coral:#ff7a59; --cream:#fff8e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:var(--navy)}
  body{
    background:
      radial-gradient(ellipse 120% 60% at 50% 115%, #f6e2b3 0 38%, transparent 39%),
      linear-gradient(180deg,#7fe0ea 0%,#38bccb 30%,#1c9fb8 62%,#e9cf94 86%,#f3dca8 100%);
  }
  /* sun rays */
  .rays{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:.35;mix-blend-mode:screen}
  .rays i{position:absolute;top:-20%;width:14vw;height:140%;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0) 75%);transform-origin:top center;filter:blur(6px);animation:sway 9s ease-in-out infinite alternate}
  .rays i:nth-child(1){left:8%;transform:rotate(14deg)}
  .rays i:nth-child(2){left:32%;transform:rotate(8deg);animation-delay:-3s;width:9vw}
  .rays i:nth-child(3){left:58%;transform:rotate(-6deg);animation-delay:-5s}
  .rays i:nth-child(4){left:80%;transform:rotate(-14deg);animation-delay:-1s;width:8vw}
  @keyframes sway{to{margin-left:4vw}}
  .bubble{position:fixed;bottom:-30px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),rgba(255,255,255,.08) 60%);pointer-events:none;animation:rise linear infinite}
  @keyframes rise{to{transform:translate(var(--dx),-115vh)}}
  /* seabed decorations */
  .deco{position:fixed;bottom:0;pointer-events:none;font-size:clamp(28px,6vh,64px);filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}

  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;z-index:5000}
  .tabs{display:flex;gap:6px;background:rgba(255,255,255,.35);padding:5px;border-radius:999px;backdrop-filter:blur(4px)}
  .tab{border:0;font:inherit;font-weight:800;font-size:clamp(13px,2vh,17px);padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--navy);background:transparent;position:relative}
  .tab.on{background:linear-gradient(#ffb38a,#ff7a59);color:#fff;box-shadow:0 3px 0 #d4553a;text-shadow:0 1px 0 rgba(0,0,0,.2)}
  .tab.locked{opacity:.55;cursor:not-allowed}
  .tab.locked::after{content:"🔒";font-size:.75em;margin-left:3px}
  .stat{background:var(--cream);border:3px solid #fff;border-radius:18px;padding:2px 14px;text-align:center;box-shadow:0 4px 0 rgba(13,74,107,.25);min-width:84px}
  .stat small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;line-height:1.3}
  .stat b{font-size:clamp(18px,3vh,26px);line-height:1.1}
  .stats{display:flex;gap:8px}
  .title{font-weight:800;font-size:clamp(18px,3.2vh,30px);color:#fff;text-shadow:0 3px 0 var(--navy),0 0 12px rgba(13,74,107,.4);letter-spacing:.02em;white-space:nowrap}

  #board{position:fixed;left:0;right:0;top:70px;bottom:78px}
  .tile{position:absolute;background-size:100% 100%;cursor:pointer;transition:transform .15s,filter .15s,opacity .3s;filter:drop-shadow(-3px 5px 3px rgba(9,52,74,.35))}
  .tile.blocked{filter:drop-shadow(-3px 5px 3px rgba(9,52,74,.35)) brightness(.78) saturate(.75)}
  .tile.free:hover{transform:translateY(-3px)}
  .tile.sel{transform:translateY(-6px) scale(1.04);filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px #ffd64a) drop-shadow(-3px 8px 4px rgba(9,52,74,.35))}
  .tile.hint{animation:hint .6s ease-in-out 3}
  @keyframes hint{50%{transform:translateY(-8px) scale(1.06);filter:drop-shadow(0 0 12px #7dff9a) drop-shadow(0 0 4px #fff)}}
  .tile.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .tile.gone{animation:poof .45s forwards;pointer-events:none}
  @keyframes poof{40%{transform:scale(1.12) translateY(-10px)}100%{transform:scale(.2) translateY(-60px) rotate(10deg);opacity:0}}

  footer{position:fixed;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:clamp(6px,1.5vw,14px);z-index:5000;flex-wrap:wrap;padding:0 8px}
  .btn{border:0;font:inherit;font-weight:800;font-size:clamp(14px,2.2vh,19px);color:#fff;padding:8px 18px;border-radius:999px;cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.25);transition:transform .08s}
  .btn:active{transform:translateY(3px)}
  .b-hint{background:linear-gradient(#ffd96b,#f5b324);box-shadow:0 4px 0 #c98a0d;color:#6b4300;text-shadow:none}
  .b-shuf{background:linear-gradient(#6fe0e6,#20a9c0);box-shadow:0 4px 0 #13798c}
  .b-undo{background:linear-gradient(#b7a5ff,#7d63e8);box-shadow:0 4px 0 #5641b5}
  .b-new{background:linear-gradient(#ffb38a,#ff7a59);box-shadow:0 4px 0 #d4553a}
  .b-lay{background:linear-gradient(#8fe39a,#3dbb5a);box-shadow:0 4px 0 #278a3f}

  .overlay{position:fixed;inset:0;background:rgba(9,52,74,.45);display:none;align-items:center;justify-content:center;z-index:9000;backdrop-filter:blur(3px)}
  .overlay.show{display:flex}
  .card{background:var(--cream);border:5px solid #fff;border-radius:28px;padding:26px 30px;text-align:center;max-width:min(420px,90vw);box-shadow:0 10px 0 rgba(13,74,107,.3);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
  .card h2{margin:0 0 4px;font-size:34px;color:var(--coral)}
  .card p{margin:4px 0 16px;font-size:18px}
  .card .big{font-size:56px;line-height:1}
  .toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:var(--cream);border:3px solid #fff;padding:8px 18px;border-radius:999px;font-weight:800;box-shadow:0 4px 0 rgba(13,74,107,.25);z-index:8000;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .tab{white-space:nowrap}
  @media (max-width:640px){
    header{padding:8px}
    .title{display:none}
    .tabs{gap:2px;padding:3px}
    .tab{padding:4px 8px;font-size:13px}
    .stats{gap:4px}
    .stat{min-width:50px;padding:1px 6px;border-radius:14px}
    .stat small{font-size:8px;letter-spacing:0}
    .stat b{font-size:17px}
    #board{top:58px}
  }
</style>
</head>
<body>
<div class="rays"><i></i><i></i><i></i><i></i></div>
<div class="deco" style="left:1%">🪸</div><div class="deco" style="left:7%;font-size:clamp(20px,4vh,40px)">🐚</div>
<div class="deco" style="right:2%">🪸</div><div class="deco" style="right:9%;font-size:clamp(20px,4vh,40px)">⭐</div>

<header>
  <div class="tabs" id="tabs">
    <button class="tab on" data-d="easy">Easy</button>
    <button class="tab" data-d="medium">Medium</button>
    <button class="tab" data-d="hard">Hard</button>
  </div>
  <div class="title">🐠 Ocean Mahjong</div>
  <div class="stats">
    <div class="stat"><small>Pairs left</small><b id="pairs">0</b></div>
    <div class="stat"><small>Time</small><b id="time">0:00</b></div>
  </div>
</header>

<div id="board"></div>

<footer>
  <button class="btn b-hint" id="bHint">💡 Hint</button>
  <button class="btn b-shuf" id="bShuf">🔀 Shuffle</button>
  <button class="btn b-undo" id="bUndo">↩️ Undo</button>
  <button class="btn b-lay" id="bLay">🐚 Shape</button>
  <button class="btn b-new" id="bNew">🌊 New game</button>
</footer>

<div class="toast" id="toast"></div>

<div class="overlay" id="win"><div class="card">
  <div class="big">🎉🐬🎉</div>
  <h2>You did it!</h2>
  <p id="winText"></p>
  <button class="btn b-new" id="bAgain">Play again</button>
</div></div>

<div class="overlay" id="stuck"><div class="card">
  <div class="big">🐙</div>
  <h2>No more pairs!</h2>
  <p>The octopus can shuffle the tiles for you.</p>
  <button class="btn b-shuf" id="bStuckShuf">🔀 Shuffle</button>
  <button class="btn b-undo" id="bStuckUndo" style="margin-left:6px">↩️ Undo</button>
</div></div>

const $ = id => document.getElementById(id);
const board = $("board");
let diff = "easy", layoutName = null, tiles = [], sel = null, history = [], t0 = 0, timer = null, elapsed = 0, started = false;

const key = (c,r,z) => c+","+r+","+z;
const rnd = n => Math.floor(Math.random()*n);
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function parseLayout(layers){
  const pos=[];
  layers.forEach((rows,z)=>rows.forEach((row,r)=>[...row].forEach((ch,c)=>{ if(ch==="X") pos.push({c,r,z}); })));
  return pos;
}

function isFreeIn(p, occ){
  if (occ.has(key(p.c,p.r,p.z+1))) return false;
  const L = occ.has(key(p.c-1,p.r,p.z)), R = occ.has(key(p.c+1,p.r,p.z));
  return !(L && R);
}

// Build a deal that is guaranteed solvable: remove free pairs from the full layout,
// then give each removed pair the same picture. That removal order is a solution.
function deal(positions, designs){
  // designs: array with each design appearing an even number of times
  const pairs=[]; const cnt={};
  designs.forEach(d=>cnt[d]=(cnt[d]||0)+1);
  for(const d in cnt) for(let i=0;i<cnt[d]/2;i++) pairs.push(d);
  for(let attempt=0; attempt<500; attempt++){
    const occ=new Map(positions.map(p=>[key(p.c,p.r,p.z),p]));
    const order=[]; let ok=true;
    while(occ.size){
      const free=[...occ.values()].filter(p=>isFreeIn(p,occ));
      if(free.length<2){ok=false;break}
      // prefer picking from different areas so it doesn't feel too easy
      const a=free.splice(rnd(free.length),1)[0];
      const b=free[rnd(free.length)];
      occ.delete(key(a.c,a.r,a.z)); occ.delete(key(b.c,b.r,b.z));
      order.push([a,b]);
    }
    if(!ok) continue;
    shuffleArr(pairs);
    const out=new Map();
    order.forEach(([a,b],i)=>{ out.set(a,pairs[i]); out.set(b,pairs[i]); });
    return out;
  }
  return null;
}

let TW=60, TH=66, ROWSTEP=58, ZX=5, ZY=7, offX=0, offY=0;
function measure(){
  const pos=tiles.length?tiles:[];
  const maxC=Math.max(...pos.map(t=>t.c))+1, maxR=Math.max(...pos.map(t=>t.r))+1, maxZ=Math.max(...pos.map(t=>t.z));
  const bw=board.clientWidth-20, bh=board.clientHeight-10;
  // tile art is 180x200; the bottom ~11% is the 3D base, rows overlap there
  const ratio=200/180, step=0.89;
  let w=Math.min(bw/(maxC+0.3), bh/((maxR-1)*step*ratio+ratio+0.2));
  w=Math.min(w,130);
  TW=w; TH=w*ratio; ROWSTEP=TH*step; ZX=w*0.07; ZY=w*0.09;
  const totW=maxC*TW + maxZ*ZX, totH=(maxR-1)*ROWSTEP+TH + maxZ*ZY;
  offX=(board.clientWidth-totW)/2 + maxZ*ZX; offY=(board.clientHeight-totH)/2 + maxZ*ZY;
}
function place(t){
  const el=t.el;
  el.style.width=TW+"px"; el.style.height=TH+"px";
  el.style.left=(offX+t.c*TW - t.z*ZX)+"px";
  el.style.top=(offY+t.r*ROWSTEP - t.z*ZY)+"px";
  el.style.zIndex=t.z*1000+t.r*30+t.c;
}
function occMap(){return new Map(tiles.filter(t=>!t.gone).map(t=>[key(t.c,t.r,t.z),t]))}
function refresh(){
  const occ=occMap();
  tiles.forEach(t=>{ if(t.gone) return; t.free=isFreeIn(t,occ); t.el.classList.toggle("free",t.free); t.el.classList.toggle("blocked",!t.free); });
  const left=tiles.filter(t=>!t.gone).length/2;
  $("pairs").textContent=left;
  $("bUndo").disabled=!history.length;
}

function newGame(keepLayout){
  const set=SETS[diff]; const lays=LAYOUTS[diff];
  const names=Object.keys(lays);
  if(!keepLayout || !layoutName){ layoutName = names[rnd(names.length)]; }
  const positions=parseLayout(lays[layoutName]);
  const designs=[]; const per=positions.length/set.length; // 4 each on Easy
  set.forEach(d=>{for(let i=0;i<per;i++)designs.push(d)});
  const map=deal(positions,designs);
  board.innerHTML=""; tiles=[]; sel=null; history=[];
  positions.forEach(p=>{
    const t={...p,d:map.get(p),gone:false};
    t.el=document.createElement("div"); t.el.className="tile";
    t.el.style.backgroundImage=`url(${IMG[t.d]})`;
    t.el.onclick=()=>tap(t);
    tiles.push(t); board.appendChild(t.el);
  });
  measure(); tiles.forEach(place); refresh();
  stopTimer(); elapsed=0; started=false; $("time").textContent="0:00";
  $("bLay").textContent="🐚 "+layoutName;
}

function tap(t){
  if(t.gone) return;
  if(!t.free){ t.el.classList.remove("shake"); void t.el.offsetWidth; t.el.classList.add("shake"); return; }
  if(!started){ started=true; startTimer(); }
  if(sel===t){ t.el.classList.remove("sel"); sel=null; return; }
  if(sel && sel.d===t.d){
    const a=sel, b=t; sel=null;
    a.el.classList.remove("sel");
    [a,b].forEach(x=>{x.gone=true; x.el.classList.add("gone");});
    history.push([a,b]);
    refresh();
    setTimeout(checkEnd,350);
    return;
  }
  if(sel) sel.el.classList.remove("sel");
  sel=t; t.el.classList.add("sel");
}

function findPair(){
  const free=tiles.filter(t=>!t.gone&&t.free);
  for(let i=0;i<free.length;i++)for(let j=i+1;j<free.length;j++) if(free[i].d===free[j].d) return [free[i],free[j]];
  return null;
}
function checkEnd(){
  const left=tiles.filter(t=>!t.gone);
  if(!left.length){ stopTimer(); $("winText").textContent=`All ${tiles.length/2} pairs found in ${fmt(elapsed)}!`; $("win").classList.add("show"); celebrate(); return; }
  if(!findPair()) $("stuck").classList.add("show");
}
function hint(){
  const p=findPair();
  if(!p){ $("stuck").classList.add("show"); return; }
  p.forEach(t=>{t.el.classList.remove("hint"); void t.el.offsetWidth; t.el.classList.add("hint");});
}
function undo(){
  const last=history.pop(); if(!last) return;
  last.forEach(t=>{t.gone=false; t.el.classList.remove("gone","sel");});
  if(sel){sel.el.classList.remove("sel"); sel=null;}
  refresh(); $("stuck").classList.remove("show");
}
function reshuffle(){
  const left=tiles.filter(t=>!t.gone);
  if(!left.length) return;
  const map=deal(left.map(t=>({c:t.c,r:t.r,z:t.z,ref:t})), left.map(t=>t.d));
  if(!map){ toast("Couldn't shuffle — try Undo"); return; }
  for(const [p,d] of map){ p.ref.d=d; p.ref.el.style.backgroundImage=`url(${IMG[d]})`; }
  if(sel){sel.el.classList.remove("sel"); sel=null;}
  history=[]; refresh(); $("stuck").classList.remove("show"); toast("🔀 Shuffled!");
}
function nextLayout(){
  const names=Object.keys(LAYOUTS[diff]); layoutName=names[(names.indexOf(layoutName)+1)%names.length];
  newGame(true);
}

function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function startTimer(){ t0=Date.now()-elapsed*1000; timer=setInterval(()=>{elapsed=Math.floor((Date.now()-t0)/1000); $("time").textContent=fmt(elapsed)},500); }
function stopTimer(){ clearInterval(timer); timer=null; }
let toastT; function toast(m){const e=$("toast"); e.textContent=m; e.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove("show"),1600);}

function celebrate(){
  const em=["🐠","🐬","🐙","⭐","🐚","🫧","🐢","🦀"];
  for(let i=0;i<40;i++){
    const s=document.createElement("div"); s.textContent=em[rnd(em.length)];
    s.style.cssText=`position:fixed;left:${rnd(100)}vw;bottom:-40px;font-size:${24+rnd(26)}px;z-index:9500;pointer-events:none;transition:transform ${2+Math.random()*2}s ease-out,opacity 3s;`;
    document.body.appendChild(s);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.transform=`translate(${rnd(200)-100}px,-${70+rnd(40)}vh) rotate(${rnd(360)}deg)`; s.style.opacity="0";}));
    setTimeout(()=>s.remove(),4500);
  }
}
function bubbles(){
  for(let i=0;i<14;i++){
    const b=document.createElement("div"); b.className="bubble"; const s=6+rnd(18);
    b.style.cssText=`width:${s}px;height:${s}px;left:${rnd(100)}vw;animation-duration:${8+rnd(10)}s;animation-delay:-${rnd(15)}s;--dx:${rnd(60)-30}px`;
    document.body.appendChild(b);
  }
}

document.querySelectorAll(".tab").forEach(b=>{
  if(!SETS[b.dataset.d]) b.classList.add("locked");
  b.onclick=()=>{
    if(!SETS[b.dataset.d]){ toast("🔒 Coming soon — new sea creatures on the way!"); return; }
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
    diff=b.dataset.d; layoutName=null; newGame();
  };
});
$("bHint").onclick=hint; $("bShuf").onclick=reshuffle; $("bUndo").onclick=undo;
$("bNew").onclick=()=>newGame(false); $("bLay").onclick=nextLayout;
$("bAgain").onclick=()=>{$("win").classList.remove("show"); newGame(false);};
$("bStuckShuf").onclick=reshuffle; $("bStuckUndo").onclick=undo;
window.addEventListener("resize",()=>{ if(tiles.length){ measure(); tiles.forEach(place);} });

bubbles();
newGame();
</script>
</body>
</html>
